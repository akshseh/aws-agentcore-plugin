<script type="application/json">{"data": {"items": [{"fields": {"id": "awt-content-topics#what-is-amazon-bedrock-agentcore-0", "itemHeading": "What is Amazon Bedrock AgentCore?", "itemLongLoc": "<p>Amazon Bedrock AgentCore is the platform to build, connect, and optimize AI agents at scale. Build with any open-source framework and any model. Connect agents to your tools and data with authentication and access controls built in. Monitor and improve agents in production with tracing and evaluation. AgentCore handles the infrastructure so you focus on agent logic, not backend plumbing, and you get enterprise-grade security and reliability without giving up open-source flexibility.&nbsp;</p>"}, "metadata": {"tags": [{"name": "General", "namespaceId": "awt-content-topics#ams#c1", "id": "awt-content-topics#ams#c1#general-0"}]}}, {"fields": {"id": "awt-content-topics#who-is-agentcore-designed-for-1", "itemHeading": "Who is AgentCore designed for?", "itemLongLoc": "<p>AgentCore is designed for organizations who want to move agents from proofs of concept built using open-source or custom agent frameworks to production. It serves developers and enterprises who need robust infrastructure to support dynamic execution paths at runtime, controls to monitor behavior, powerful tools to enhance agents, and the flexibility to adapt as the landscape evolves.</p>"}, "metadata": {"tags": [{"name": "General", "namespaceId": "awt-content-topics#ams#c1", "id": "awt-content-topics#ams#c1#general-0"}]}}, {"fields": {"id": "awt-content-topics#what-capabilities-does-agentcore-provide-2", "itemHeading": "What capabilities does AgentCore provide?", "itemLongLoc": "<p>AgentCore provides composable capabilities that work together or independently. Use what you need today and add more as your agents take on more responsibility.</p> \n<p><b>Runtime</b>: Provides a secure, serverless environment purpose-built for deploying and scaling dynamic agents and tools.</p> \n<p><b>Memory</b>: Enables developers to build context-aware agents by eliminating complex memory infrastructure management while providing full control over agent memory.</p> \n<p><b>Gateway</b>: Offers an easy and secure way for agents to access tools by transforming APIs and Lambda functions into agent-compatible tools and connecting to existing MCP servers.</p> \n<p><b>Browser</b>: Provides a fast, secure, cloud-based browser runtime to enable agents to interact with websites.</p> \n<p><b>Code Interpreter</b>: Enables agents to write and execute code securely in sandbox environments, enhancing their accuracy and expanding their ability to solve complex end-to-end tasks.</p> \n<p><b>Identity</b>: Allows agents to securely access and operate across AWS resources or third-party tools and services, on behalf of users or by themselves.</p> \n<p><b>Observability</b>: Gives developers complete visibility into agent workflows to trace, debug, and monitor agents' performance.</p> \n<p><b>Evaluations</b>: Helps teams improve agent quality through continuous performance monitoring and real-time quality scoring</p> \n<p><b>Optimization</b>: Turns production traces into continuous improvement, helping teams surface failure, intent and trajectory insights, generate data-grounded fixes, and validate them before they ship.</p> \n<p><b>Policy</b>: Gives you comprehensive control over actions agents take, helping agents to stay within defined boundaries without slowing down</p> \n<p><b>Agent Registry (Preview):</b> A single place to discover, share, and reuse AI agents, tools, and agent skills across your enterprise, with built-in governance, approval workflows, and intelligent search, regardless of where they're built or hosted.&nbsp;<br> <b><br> Payments (Preview):</b> Helps you develop agentic micropayment solutions to pay for paid APIs, MCP servers, web content at runtime, using a third-party wallet (Coinbase and Stripe), while allowing per-session spending limits, observability and payment orchestration over x402 protocol.&nbsp; &nbsp;</p>"}, "metadata": {"tags": [{"name": "General", "namespaceId": "awt-content-topics#ams#c1", "id": "awt-content-topics#ams#c1#general-0"}]}}]}}</script>
</body></html>
